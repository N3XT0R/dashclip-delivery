exclude_patterns = [
  "**/vendor/**",
  "**/dist/**",
  "**/node_modules/**",
  "**/cache/**",
  "**/public/**",
  "**/app/Policies/**",
  "**/database/**",
  "**/lang/**",
  "**/config/**",
  "**/deploy_laravel_config.php"
]

test_patterns = ["**/tests/**"]

[project]
name = "dashclip-delivery"
language = "php"
coverage = true

[coverage]
report = "coverage/clover.xml"
tool = "phpunit"

[analyze]
enabled = true

[similar_code]
exclude_patterns = [
  "**/tests/**",
  "**/dist/**",
  "**/vendor/**",
  "**/docs/**",
  "**/public/**",
  "**/database/**",
  "**/lang/**",
  "**/config/**",
  "**/deploy_laravel_config.php",
  # REST API v1 controllers and OpenAPI definition classes: their remaining
  # similarity is declarative OpenAPI PHP-attribute metadata describing four
  # parallel REST resources, not application logic. The logic itself is thin
  # (index/show/store bodies delegate to ApiController helpers, use cases and
  # repositories). Shared error responses, pagination parameters and the
  # paginated-list flow are already extracted; forcing the per-endpoint
  # contract annotations behind further abstraction hurts readability.
  "**/app/Http/Controllers/Api/V1/**",
  "**/app/OpenApi/**"
]

[files]
include = ["app/"]
exclude = [
  "vendor/**",
  "tests/**",
  "dist/**",
  "node_modules/**",
  "public/**",
  "app/Policies/**",
  "**/database/**",
  "**/lang/**",
  "**/config/**",
  "**/deploy_laravel_config.php"
]
