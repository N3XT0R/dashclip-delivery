exclude_patterns = [
  # Data carriers: DTOs, value objects and mailables exist to carry a set of fields from one place
  # to another. Their constructors list exactly those fields, so the number of them is the point of
  # the class, not a smell, and wrapping them in yet another object would only move the list one
  # level down. They hold no logic of their own, which the tests cover where it lives.
  "**/app/DTO/**",
  "**/app/ValueObjects/**",
  "**/app/Mail/**",
  "**/vendor/**",
  "**/dist/**",
  "**/node_modules/**",
  "**/cache/**",
  "**/public/**",
  "**/app/Policies/**",
  "**/database/**",
  "**/lang/**",
  "**/config/**",
  "**/deploy_laravel_config.php"
]

test_patterns = ["**/tests/**"]

[project]
name = "dashclip-delivery"
language = "php"
coverage = true

[coverage]
report = "coverage/clover.xml"
tool = "phpunit"

[analyze]
enabled = true

# REST API v1 controllers and OpenAPI definition classes: the code duplication
# the analyzer still sees there is declarative OpenAPI PHP-attribute metadata
# describing several parallel REST resources, not application logic. The logic
# itself is thin (index/show/store bodies delegate to ApiController helpers,
# use cases and repositories). Shared error responses, pagination parameters and
# the paginated-list flow are already extracted; forcing the per-endpoint
# contract annotations behind further abstraction hurts readability. The
# built-in maintainability analyzer (duplication and structure smells) is muted
# for these paths, every external linter still runs.
[[exclude]]
plugins = ["qlty"]
file_patterns = [
  "app/Http/Controllers/Api/V1/**",
  "app/OpenApi/**",
]

[files]
include = ["app/"]
exclude = [
  "vendor/**",
  "tests/**",
  "dist/**",
  "node_modules/**",
  "public/**",
  "app/Policies/**",
  "**/database/**",
  "**/lang/**",
  "**/config/**",
  "**/deploy_laravel_config.php"
]
